name: Release

# 说明：本流水线目前因账单问题无法运行（只有仓库所有者能处理）。
# 真实发布走本机 `Scripts/release.sh`，它做同样的事且不依赖 Actions。
# 本文件保持可用状态，账单恢复后无需改动即可接管。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v1.0.0-beta1）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # 提交数要参与 CFBundleVersion，必须拿全历史。
          fetch-depth: 0

      - name: 版本规则（非法 tag 直接拒发）
        run: |
          bash Scripts/version-check.sh --self-test
          bash Scripts/version-check.sh "$TAG_NAME"

      - name: 命名单一来源
        run: bash Scripts/naming.sh --check

      - name: 敏感内容扫描
        run: bash Scripts/scan-content.sh

      - name: 构建 + 打包（tag 注入，注入值与 ref 不一致即 FAIL）
        run: |
          TAG="$TAG_NAME" \
          VERIFY_TAG="$TAG_NAME" \
          CONFIG=release \
          PACKAGE=1 \
          OUT="$PWD/build/Brimio.app" \
          DIST="$PWD/dist" \
          bash Scripts/make-app.sh

      - name: 资产校验（sha256 / 包内 plist / 命名模板 / 架构）
        run: |
          COMMITS="$(git rev-list --count "$TAG_NAME^{commit}")"
          ASSET="$(bash Scripts/naming.sh --asset "$TAG_NAME")"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          bash Scripts/release-verify.sh --expect-build "$COMMITS" "$TAG_NAME" "dist/$ASSET"

      - name: 首次安装用 dmg（仅 stable）
        run: |
          case "$TAG_NAME" in
            *-alpha*|*-beta*|*-RC*) echo "预发布不出 dmg"; exit 0 ;;
          esac
          bash Scripts/make-dmg.sh build/Brimio.app --tag "$TAG_NAME" --out dist

      - name: feed 记录必须已在 tag 内提交
        # 记录（Release/feed/items.jsonl）由本机 `Scripts/release.sh --add` 写入，
        # 随发布提交一起进入 tag；CI 不生成、不回写，保证「tag = 可复现的发布内容」。
        run: |
          python3 - "$TAG_NAME" <<'PY'
          import json, os, sys
          tag = sys.argv[1]
          path = "Release/feed/items.jsonl"
          found = False
          if os.path.exists(path):
              for line in open(path, encoding="utf-8"):
                  line = line.strip()
                  if line and json.loads(line).get("tag") == tag:
                      found = True
          if not found:
              sys.exit(f"FAIL {path} 里没有 {tag}：先在本机跑 Scripts/release.sh --add 并提交")
          print(f"[ci] feed 记录存在：{tag}")
          PY

      - name: 生成通道清单
        run: bash Scripts/release-feed.sh --emit

      - name: 创建 GitHub Release 并附产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=()
          case "$TAG_NAME" in
            *-alpha*|*-beta*|*-RC*) FLAGS+=(--prerelease --latest=false) ;;
          esac
          gh release create "$TAG_NAME" \
            "dist/$ASSET" \
            "dist/$ASSET.sha256" \
            --title "$TAG_NAME" \
            --generate-notes \
            "${FLAGS[@]}"

      - name: 更新清单挂到固定 tag（URL 与版本无关）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view feed >/dev/null 2>&1 || \
            gh release create feed --prerelease --latest=false \
              --title "更新清单" --notes "客户端更新检查读取这两个文件，不要删除本 Release。"
          gh release upload feed \
            "dist/feed/feed-stable.json" \
            "dist/feed/feed-beta.json" \
            --clobber
