name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 只读权限：PR 与主干推送都不需要写仓库。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          xcodebuild -version
          swift --version

      - name: 命名单一来源（Config/naming.env ↔ 生成文件）
        run: bash Scripts/naming.sh --check

      - name: 版本号规则（合法/非法用例）
        run: bash Scripts/version-check.sh --self-test

      - name: 敏感内容扫描（命中即失败）
        run: bash Scripts/scan-content.sh

      - name: 构建
        run: swift build -c release

      - name: selftest（无屏：注入固定几何，并证明走的是注入路径）
        # runner 没有物理屏，几何用固定值注入；日志里必须出现 source=injected 与不覆盖清单。
        # 不在这里加 `|| true`：断言失败就是失败。
        run: |
          .build/release/Brimio --selftest \
            --headless-geometry=1512x982,inset=32,menubar=32 | tee selftest.log
          grep -q "geometry source is injected" selftest.log
          grep -q "本环境不覆盖" selftest.log
          echo "headless selftest verified: injected geometry + uncovered list printed"

      - name: 打包冒烟（不发布）
        run: |
          TAG="v0.0.0" \
          CONFIG=release \
          OUT="$PWD/build/Brimio.app" \
          bash Scripts/make-app.sh
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Brimio.app/Contents/Info.plist

      - name: 更新链路模拟（镜像切换 / sha256 / 通道隔离 / 防降级）
        # 本地起 http 服务，全部离线；任何一条断言失败即失败。
        run: bash Scripts/update-sim.sh
